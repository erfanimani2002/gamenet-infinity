<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گیمنت اینفینیتی</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');
  </style>
</head>
<body>

  <div id="loginScreen">
    <div class="login-box">
      <img src="img/logo.webp" alt="لوگو" style="height:80px;margin-bottom:12px;">
      <h1>گیمنت اینفینیتی</h1>
      <p class="subtitle">سیستم مدیریت مجموعه گیم‌نت</p>
      <input type="text" id="loginUser" placeholder="نام کاربری" autocomplete="off">
      <input type="password" id="loginPass" placeholder="رمز عبور">
      <button type="button" onclick="App.doLogin()">ورود</button>
      <div id="loginError" class="login-error"></div>
    </div>
  </div>

  <div id="appScreen">
    <div class="sidebar" id="sidebar">
      <nav class="sidebar-menu" id="sidebarMenu"></nav>
      <div class="sidebar-footer">
        <button class="theme-toggle" onclick="App.toggleTheme()" id="themeToggle">
          <span id="themeIcon">☀️</span>
          <span id="themeLabel">حالت تاریک</span>
        </button>
        <div class="user-dropdown" id="userDropdown" onclick="App.toggleUserMenu()">
          <span id="userDisplay"></span>
          <span class="role-badge" id="roleDisplay"></span>
          <span class="dropdown-arrow">&#9662;</span>
        </div>
        <div class="user-menu" id="userMenu" style="display:none">
          <button class="btn-logout" onclick="App.doLogout()">خروج</button>
        </div>
        <div class="sidebar-logo">
          <img src="img/logo.webp" alt="گیمنت اینفینیتی" style="height:28px;">
